name: CI

# Gates that must pass before a pull request can merge.
#
# Job names here are what branch protection requires, so renaming a job means
# updating the required checks on the repository too, or merges will block on a
# check that no longer runs. Release branches require the same names, so a job
# is never renamed while an older release may still need a patch.
#
# main is staging, and each release has its own branch, release/X.Y. A change
# reaches either only through a pull request, so pull requests into both run
# here, and again in the merge queue on the exact commit that will land.
# Nothing runs on a push: main and a release branch only ever move forward to a
# commit that has already passed every check here, and those results stay on
# that commit. A second run would test the same commit again and double the
# load on staging's test accounts.
on:
  pull_request:
    branches: [main, 'release/**']
  # The merge queue builds each queued pull request on top of main and runs
  # these checks on that result before it lands, so a change can only reach
  # main after passing against what is already there.
  merge_group:
  # The UI tests run once a night, not on every pull request (project
  # rule, 2026-10-22). 09:00 UTC is 03:00 in Mountain Daylight Time.
  schedule:
    - cron: '0 9 * * *'
  # Started by hand, it runs everything, as the nightly does. "houses" runs
  # the Houses UI job without the other UI suites, to prove one change to it.
  workflow_dispatch:
    inputs:
      only:
        description: 'Leave empty to run everything. "houses" skips the other UI suites.'
        required: false
        default: ''

# A newer push to a pull request stops its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate 1. Everything else is only worth running if this passes.
  unit-tests:
    name: Unit tests
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The image's default Xcode can be behind what the dependency tree needs.
      # fluent-postgres-driver 2.13 requires swift-tools-version 6.2, and a
      # too-old toolchain fails at resolution with a message that does not
      # mention Xcode at all.
      - name: Select the newest Xcode on the image
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      # The package floor is macOS 14 / iOS 17, set by HPKE.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            Server/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Server/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Client tests
        run: swift test

      - name: Server tests
        run: cd Server && swift test --filter WellSpentServerTests

      # The real client against the real server over HTTP. Boots the server
      # in-process on a random port and needs no database service, because
      # development and test both run on SQLite.
      - name: Integration tests
        run: cd Server && swift test --filter IntegrationTests

  # Gate 2. Runs only if the tests pass, because a coverage number from a failing
  # suite means nothing.
  coverage:
    name: Coverage floor
    needs: unit-tests
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the image
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-cov-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-cov-${{ runner.os }}-

      # Covers the library targets. WellSpentApp is an executable with no test
      # target depending on it, so it is not linked into the test binary and
      # cannot be measured here. See scripts/coverage.sh and STATUS.md. The
      # floor is coverage.sh's own, 90 percent, the sign-off rule's number.
      - name: Line coverage
        run: ./scripts/coverage.sh

  # The server ships as a Linux container, and nothing else in this workflow
  # compiles it for Linux. A macOS build passing says nothing about whether
  # swift-crypto, GRDB and the Vapor stack resolve and build on the target.
  docker-build:
    name: Linux container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The default docker driver cannot export a cache, so `cache-to` fails the
      # build before it compiles anything. buildx gives the container driver,
      # which supports both caching and `load`.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: wellspent-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A binary that builds but cannot start is not much of a result.
      - name: It starts and answers a health check
        run: |
          docker run -d --name wellspent -p 8080:8080 \
            -e WELLSPENT_SQLITE_PATH=/tmp/ci.sqlite \
            wellspent-server:ci serve --env development --hostname 0.0.0.0 --port 8080
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "never became healthy. Logs:"
          docker logs wellspent
          exit 1

      - name: Stop
        if: always()
        run: docker rm -f wellspent || true

  # Every other test in this repository runs on SQLite, and Postgres is what
  # production uses. This job is the only thing that proves the migrations, the
  # unique constraints and a real connection pool behave on the real driver.
  postgres-tests:
    name: Server tests on Postgres
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The same image the Dockerfile builds with, so a failure here is a failure
    # the container would also have.
    container: swift:6.2-noble

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wellspent
          POSTGRES_PASSWORD: wellspent
          POSTGRES_DB: wellspent_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Deliberate. Configure.swift checks DATABASE_URL before the .testing
      # branch, so this one variable points the whole suite at Postgres instead
      # of in-memory SQLite, which is exactly what is wanted here.
      #
      # The host is the service name rather than localhost, because this job runs
      # inside a container on the same network as the service.
      DATABASE_URL: postgres://wellspent:wellspent@postgres:5432/wellspent_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swift --version

      # GRDB needs sqlite3.h and the swift image does not ship it. The Dockerfile
      # never needed this because `swift build --product WellSpentServer` does not
      # pull GRDB into the graph, while `swift test` builds every target in the
      # package, and the test targets reach the client's Store.
      # Python reads the coverage report, after the tests.
      - name: Install the SQLite headers GRDB needs, and Python
        run: |
          scripts/apt-install.sh libsqlite3-dev python3

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Server/.build
          key: spm-linux-pg-${{ hashFiles('Server/Package.resolved', 'Package.resolved') }}
          restore-keys: spm-linux-pg-

      # --no-parallel is load bearing. swift-testing serialises within a suite,
      # not across the five of them, and every test builds its own Application
      # whose configure() calls autoMigrate(). Against one shared database those
      # racing migrations fight over _fluent_migrations and CREATE TABLE. On
      # SQLite each test gets a private in-memory database, which is why this has
      # never surfaced.
      #
      # The suite also assumes a database that starts empty, because several
      # tests register fixed email addresses and Postgres persists where
      # in-memory SQLite did not. A fresh service container gives that, so do not
      # run this step twice in one job.
      #
      # IntegrationTests is left out on purpose: it registers
      # stranger@example.com and so does this suite, so sharing one database
      # turns the second signup into a 409. It needs a database of its own.
      #
      # No -F flags here. Those exist for macOS with CommandLineTools selected;
      # on Linux SwiftPM builds swift-testing from source.
      - name: Server tests against Postgres
        working-directory: Server
        run: swift test --no-parallel --filter WellSpentServerTests --enable-code-coverage

      # The server's own code, measured by the run above, held to the same
      # floor as the app's (scripts/server-coverage.sh). coverage.sh measures
      # the app's package only and never sees Server/.
      - name: Server line coverage
        run: scripts/server-coverage.sh

  # The Linux app shares everything below its screens with the Mac app. This
  # proves that shared code builds and passes its tests on Linux, so a change
  # that only works on the Mac cannot land. The Mac screens and their tests
  # are fenced off with `#if canImport(SwiftUI)`.
  linux-client-tests:
    name: Linux client tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install the SQLite headers GRDB needs
        run: |
          scripts/apt-install.sh libsqlite3-dev

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-client-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-linux-client-

      - name: Build and test
        run: swift build --build-tests && swift test --skip-build --no-parallel

  # The Linux desktop app in Linux/. It draws the shared screen models, so a
  # change to them that breaks the Linux screens fails here, not on the box.
  linux-app-build:
    name: Linux app builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install the GTK 4, libsecret and SQLite headers
        run: |
          scripts/apt-install.sh libgtk-4-dev libsecret-1-dev libsqlite3-dev pkg-config

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Linux/.build
          key: spm-linux-app-${{ hashFiles('Linux/Package.resolved', 'Package.resolved') }}
          restore-keys: spm-linux-app-

      - name: Build
        run: swift build --package-path Linux

      - name: Test
        run: swift test --package-path Linux

  # The same client, with the private Properties package linked. The package
  # comes from WellSpent-OC/WellSpent-Properties through a read-only deploy
  # key, so nothing from it lands in this repository. Builds without the key
  # (a fork, a pull request from one) say so and pass.
  linux-client-with-properties:
    name: Linux client with Properties
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: swift:6.2-noble
    env:
      HAS_PROPERTIES_KEY: ${{ secrets.PROPERTIES_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: No deploy key here, so nothing to build with
        if: env.HAS_PROPERTIES_KEY != 'true'
        run: echo "PROPERTIES_DEPLOY_KEY is not set; the public build without the package is the other job."

      - name: Install the SQLite headers GRDB needs, and ssh
        if: env.HAS_PROPERTIES_KEY == 'true'
        run: |
          scripts/apt-install.sh libsqlite3-dev openssh-client

      - name: Check out the Properties package at .github/properties-ref
        if: env.HAS_PROPERTIES_KEY == 'true'
        env:
          PROPERTIES_DEPLOY_KEY: ${{ secrets.PROPERTIES_DEPLOY_KEY }}
        run: scripts/checkout-properties.sh "$RUNNER_TEMP/wellspent-properties"

      - name: Cache SwiftPM
        if: env.HAS_PROPERTIES_KEY == 'true'
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-properties-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-linux-properties-

      # The seam's own test checks that the registry offers Properties when,
      # and only when, the package is linked.
      - name: Build and test with the package linked
        if: env.HAS_PROPERTIES_KEY == 'true'
        env:
          WELLSPENT_PROPERTIES_PATH: ${{ runner.temp }}/wellspent-properties
          WELLSPENT_PROPERTIES_LINKED: "1"
        run: |
          swift build --build-tests
          swift test --skip-build --no-parallel --filter PropertiesRegistrationTests

      # The Linux app with Houses' Linux screens linked, as testers get it.
      - name: Build the Linux app with the package linked
        if: env.HAS_PROPERTIES_KEY == 'true'
        env:
          WELLSPENT_PROPERTIES_PATH: ${{ runner.temp }}/wellspent-properties
        run: |
          scripts/apt-install.sh libgtk-4-dev libsecret-1-dev pkg-config
          swift build --package-path Linux

  # The Linux app's UI tests (Linux/UITests), headless: they find what's on
  # screen through GTK's accessibility tree and act as a person does. Not a
  # required check until its first green run. In two parts at once, as the
  # Mac's are: run_tests.py splits the modules by WELLSPENT_UI_SHARD, and one
  # run took longer than the two hours a job may.
  linux-ui-test-part:
    name: Linux UI test, part ${{ matrix.part }} of 2
    # Nightly and by hand only; a pull request runs the fast checks.
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && inputs.only != 'houses' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    container:
      image: swift:6.2.4-noble
      # A failed step reads a stuck app's stacks with lldb, which needs ptrace.
      options: --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@v4

      - name: Install the GTK 4 headers, a virtual display, a keyring and the accessibility bus
        run: |
          xargs -a Linux/UITests/packages.txt scripts/apt-install.sh

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Linux/.build
          key: spm-linux-app-${{ hashFiles('Linux/Package.resolved', 'Package.resolved') }}
          restore-keys: spm-linux-app-

      # Built counting what runs, so the tests also measure the Linux app's
      # own code. SwiftPM counts Swift only, so the C helpers get the C
      # compiler's flags too.
      - name: Build the app
        run: >
          swift build --package-path Linux --enable-code-coverage
          -Xcc -fprofile-instr-generate -Xcc -fcoverage-mapping

      - name: Build the matching disposable server
        run: swift build --package-path Server --product WellSpentServer

      - name: Run the UI tests
        env:
          WELLSPENT_UI_OUT: ${{ github.workspace }}/.build/linux-ui-test
          # Each copy of the app writes its counts as it quits, one file each.
          LLVM_PROFILE_FILE: ${{ github.workspace }}/.build/linux-ui-test/coverage/%p.profraw
          # WarTable's tests run in the job below, which does not fail the night.
          WELLSPENT_UI_LEAVE_OUT: test_wartable
          WELLSPENT_UI_SHARD: ${{ matrix.part }}/2
        # A private SQLite database and synthetic mailbox from this revision;
        # no deployed-server version or account secret is needed for this run.
        run: >
          WELLSPENT_APP="$(swift build --package-path Linux --show-bin-path)/WellSpentLinux"
          python3 Server/scripts/with-ui-fixture.py
          --server "$(swift build --package-path Server --show-bin-path)/WellSpentServer"
          -- Linux/UITests/run.sh

      # The counts go to the job below, which measures both parts together.
      # Part 1's app goes too: the counts are read against the app they came
      # from, and both parts build it from the same commit.
      - name: Keep this part's coverage counts
        if: always()
        shell: bash
        run: |
          mkdir -p .build/linux-ui-coverage
          # Named by process ID, which both parts count from the same low
          # numbers, so the part goes in the name: the job below puts both
          # parts' files in one folder, and a same-named file would replace one.
          for file in .build/linux-ui-test/coverage/*.profraw; do
            if [ -e "$file" ]; then cp "$file" ".build/linux-ui-coverage/part${{ matrix.part }}-$(basename "$file")"; fi
          done
          if [ "${{ matrix.part }}" = 1 ]; then
            cp "$(swift build --package-path Linux --show-bin-path)/WellSpentLinux" .build/linux-ui-coverage/
          fi

      - name: Upload this part's coverage counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-coverage-${{ matrix.part }}
          retention-days: 1
          path: .build/linux-ui-coverage
          if-no-files-found: ignore

      - name: Keep the screenshots when the test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-test-screenshots-${{ matrix.part }}
          # A failure on the account sheet can show a test address, and
          # artifacts on a public repo are public. Kept briefly.
          retention-days: 3
          # Pictures and process notes only: a stack or the app's log could
          # hold a test session's values.
          path: |
            .build/linux-ui-test/*.png
            .build/linux-ui-test/*-process.txt
            .build/linux-ui-test/*-words.txt
          if-no-files-found: ignore

  # The night's Linux UI result, under the name it always had. It passes only
  # when every part passed, and runs after a failed part too: a job whose need
  # failed is skipped by default, and a skipped check counts as passed.
  linux-ui-test:
    name: Linux UI test
    needs: linux-ui-test-part
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && inputs.only != 'houses' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift:6.2.4-noble
    steps:
      - uses: actions/checkout@v4

      - name: Fetch both parts' coverage counts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-ui-coverage-*
          merge-multiple: true
          path: .build/linux-ui-coverage

      # The sign-off rule's floor on the Linux app's own code (ops #231).
      # Advisory until the scenarios' tests are all in: the number is low
      # until then, so it reports and does not fail the job yet.
      - name: Line coverage of the Linux app, both parts
        continue-on-error: true
        run: Linux/UITests/coverage.sh .build/linux-ui-coverage/WellSpentLinux .build/linux-ui-coverage 90

      - name: Every part passed
        env:
          RESULT: ${{ needs.linux-ui-test-part.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::A part of the Linux UI test did not pass. Its result: $RESULT."
            exit 1
          fi
          echo "Every part of the Linux UI test passed."

  # WarTable's Linux UI tests, nightly and by hand, apart from the rest. They
  # fail today (issue 115, and the code sandbox cannot start in this
  # container) while WarTable waits its turn. The job still shows red, but it
  # does not fail the night, and nothing in it is skipped. When the tests pass
  # again they go back into the job above.
  linux-wartable-ui-test:
    name: Linux UI test, WarTable
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && inputs.only != 'houses' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: swift:6.2.4-noble
      options: --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@v4

      - name: Install the GTK 4 headers, a virtual display, a keyring and the accessibility bus
        run: |
          xargs -a Linux/UITests/packages.txt scripts/apt-install.sh

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Linux/.build
          key: spm-linux-app-${{ hashFiles('Linux/Package.resolved', 'Package.resolved') }}
          restore-keys: spm-linux-app-

      - name: Build the app
        run: swift build --package-path Linux

      - name: Build the matching disposable server
        run: swift build --package-path Server --product WellSpentServer

      - name: Run WarTable's UI tests
        env:
          WELLSPENT_UI_OUT: ${{ github.workspace }}/.build/linux-ui-test
        run: >
          WELLSPENT_APP="$(swift build --package-path Linux --show-bin-path)/WellSpentLinux"
          python3 Server/scripts/with-ui-fixture.py
          --server "$(swift build --package-path Server --show-bin-path)/WellSpentServer"
          -- Linux/UITests/run.sh test_wartable

      - name: Keep the screenshots when the test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-wartable-ui-test-screenshots
          retention-days: 3
          path: |
            .build/linux-ui-test/*.png
            .build/linux-ui-test/*-process.txt
            .build/linux-ui-test/*-words.txt
          if-no-files-found: ignore

  # Gate enforcement, without branch protection.
  #
  # Branch protection and rulesets both need GitHub Pro on a private repo, so
  # GitHub will not disable the merge button for us.
  #
  # A draft pull request cannot be merged, which is the one free lever that
  # genuinely blocks. But the default GITHUB_TOKEN is NOT permitted to convert a
  # pull request to a draft: the GraphQL mutation answers "Resource not
  # accessible by integration" even with pull-requests: write. That is a GitHub
  # restriction, not a setting.
  #
  # So this job does what it can with the token it has, and tells you plainly
  # when it cannot block:
  #
  #   With a GATE_TOKEN secret  -> converts the PR to a draft. A real block.
  #   Without one               -> labels it and fails the check. Advisory only.
  #
  # To make it block, create a fine-grained personal access token with
  # "Pull requests: write" on this repository and save it as the GATE_TOKEN
  # secret. Or pay for GitHub Pro, which makes this whole job unnecessary.
  # Gate 7. The real Mac window, driven by XCUITest against staging, in two
  # parts run at once. scripts/ui-test-shard.sh picks each part's classes from
  # the test files, so a new class needs no list. The build half runs on every
  # pull request. The run half needs the test mailbox token from this
  # repository's secrets: with it each part makes its own three staging accounts,
  # so parts running at once never see each other's groups, nor does a run on
  # a desk. A pull request from a fork has no secrets, so there only the build
  # is checked. The UI test gates every commit like the other checks (project
  # rule, 2026-10-15).
  mac-ui-test-part:
    name: Mac UI test, part ${{ matrix.part }} of 2
    needs: unit-tests
    # Nightly and by hand only; a pull request runs the fast checks.
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && inputs.only != 'houses' }}
    runs-on: macos-latest
    # Every Mac scenario has a UI test now, and a part runs close to an hour
    # on GitHub's Macs. 120 leaves room; a hung run still stops.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    env:
      HAS_MAILBOX: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the image
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build the app and the UI test
        run: make ui-test-build

      # The export answer counts on the Mac app using Apple's encryption alone.
      - name: Apple's encryption only, in the built Mac app
        run: scripts/crypto-check.sh .build/xcode/Build/Products/Debug/WellSpentUITestHost.app

      - name: Make this part's own three staging accounts
        if: env.HAS_MAILBOX == 'true'
        env:
          WELLSPENT_UI_TEST_MAILBOX_TOKEN: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN }}
        run: python3 -I scripts/fresh-test-accounts.py "mac-ci-${{ matrix.part }}" "$RUNNER_TEMP/ui-test-accounts.env"

      - name: Run this part against staging
        if: env.HAS_MAILBOX == 'true'
        env:
          WELLSPENT_UI_TEST_MAILBOX_TOKEN: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN }}
        run: |
          set -a; . "$RUNNER_TEMP/ui-test-accounts.env"; set +a
          make ui-test UI_TEST_SHARD=${{ matrix.part }}/2

      # Nothing skipped (the Definition of Done, item 1). It warns for now,
      # until a first run shows what CI's machines skip, and then it fails.
      - name: Nothing skipped
        if: ${{ !cancelled() && env.HAS_MAILBOX == 'true' }}
        continue-on-error: true
        run: scripts/skipped-tests.sh .build/xcode/ui-test.xcresult

      - name: Say why the run was skipped
        if: env.HAS_MAILBOX != 'true'
        run: echo "::notice::The UI test ran its build only. The test mailbox token is not available to this pull request, which is expected for a fork."

      # The whole result bundle never leaves the runner: XCUITest's activity log
      # records the text typed into the sign-in fields, and here that text is a
      # secret. Only the screenshots are kept (project rule, 2026-10-15).
      - name: Pull the screenshots out of a failed run
        if: failure() && env.HAS_MAILBOX == 'true'
        run: |
          if [ -d .build/xcode/ui-test.xcresult ]; then
            xcrun xcresulttool export attachments --path .build/xcode/ui-test.xcresult --output-path .build/xcode/ui-test-screenshots
            scripts/keep-images.sh .build/xcode/ui-test-screenshots
          fi

      - name: Keep the screenshots when the test fails
        if: failure() && env.HAS_MAILBOX == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots-${{ matrix.part }}
          # A failure on the sign-in screen can show the test account's
          # email, and artifacts on a public repo are public. Kept briefly.
          retention-days: 3
          path: .build/xcode/ui-test-screenshots
          if-no-files-found: ignore

  # Gate 7's check, under the name Gate and the branch rules know. It passes
  # only when every part passed. It runs after a failed part too: a job whose
  # need failed is skipped by default, and a skipped check counts as passed.
  mac-ui-test:
    name: Mac UI test
    needs: mac-ui-test-part
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && inputs.only != 'houses' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.mac-ui-test-part.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::A part of the Mac UI test did not pass. Its result: $RESULT."
            exit 1
          fi
          echo "Every part of the Mac UI test passed."

  # Gate 8. Every shared library built for the iPhone simulator. Until the
  # Mac's own screens are fenced to the Mac, they compile for the iPhone too,
  # so a Mac-only call outside an `#if os(macOS)` fence fails here, on the pull
  # request that adds it, and not on the next iPhone build. Nothing runs and no
  # simulator starts.
  ios-build:
    name: iPhone build
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the image
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show the iPhone simulator SDKs
        run: xcodebuild -showsdks | grep -i simulator

      - name: Build every library for the iPhone simulator
        run: |
          xcodebuild -scheme WellSpentAppCore -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode-ios-libs build

  # Gate 9. The iPhone app in the iOS Simulator, driven by XCUITest the way a
  # person uses a phone, once in light and once in dark, each on a simulator
  # made for the run and deleted after. No window opens. It runs in two parts
  # at once, as the Mac's does. The tests that need no account run on every
  # pull request. The signed-in ones run when the test mailbox token is in this
  # repository's secrets, each job with its own three staging accounts, and skip
  # without it, as for a pull request from a fork. Each look is a job of its
  # own: one part's light look alone took 2 h 33 min on a runner, so a part
  # running both looks could never finish inside its 240 minutes.
  iphone-ui-test-part:
    name: iPhone UI test, part ${{ matrix.part }} of 2, ${{ matrix.look }}
    needs: unit-tests
    # Nightly and by hand only; a pull request runs the fast checks.
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && inputs.only != 'houses' }}
    runs-on: macos-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
        look: [light, dark]
    env:
      HAS_MAILBOX: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the image
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Show the iPhone simulators on the image
        run: xcrun simctl list runtimes available | grep '^iOS '

      - name: Build the iPhone app and its UI tests
        run: make iphone-ui-test-build

      # The export answer counts on the iPhone app using Apple's encryption alone.
      - name: Apple's encryption only, in the built iPhone app
        run: scripts/crypto-check.sh .build/xcode-iphone/Build/Products/Debug-iphonesimulator/WellSpentPhone.app

      - name: Make this job's own three staging accounts
        if: env.HAS_MAILBOX == 'true'
        env:
          WELLSPENT_UI_TEST_MAILBOX_TOKEN: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN }}
        run: python3 -I scripts/fresh-test-accounts.py "iphone-ci-${{ matrix.part }}-${{ matrix.look }}" "$RUNNER_TEMP/ui-test-accounts.env"

      - name: Run this part of the iPhone UI tests, in this look
        env:
          WELLSPENT_UI_TEST_MAILBOX_TOKEN: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/ui-test-accounts.env" ]; then set -a; . "$RUNNER_TEMP/ui-test-accounts.env"; set +a; fi
          # With no test mailbox there are no accounts, as for a fork: run the
          # tests that need none, and say so below. With one, a missing account stops the run.
          without=""; if [ "$HAS_MAILBOX" != "true" ]; then without=1; fi
          make iphone-ui-test IPHONE_UI_TEST_SHARD=${{ matrix.part }}/2 IPHONE_UI_TEST_LOOKS=${{ matrix.look }} \
            IPHONE_UI_TEST_WITHOUT_ACCOUNTS=$without

      # Nothing skipped, as for the Mac. It warns for now.
      - name: Nothing skipped
        if: ${{ !cancelled() && env.HAS_MAILBOX == 'true' }}
        continue-on-error: true
        run: scripts/skipped-tests.sh .build/xcode-iphone/ui-test-${{ matrix.look }}.xcresult

      - name: Say why the signed-in tests were skipped
        if: env.HAS_MAILBOX != 'true'
        run: echo "::notice::The iPhone UI tests ran without the signed-in ones. The test mailbox token is not available to this pull request, which is expected for a fork."

      # As for the Mac: the result bundles never leave the runner, because
      # XCUITest's activity log records what is typed into the sign-in fields.
      # Only the screenshots are kept.
      - name: Pull the screenshots out of a failed run
        if: failure()
        run: |
          look=${{ matrix.look }}
          bundle=.build/xcode-iphone/ui-test-$look.xcresult
          if [ -d "$bundle" ]; then
            xcrun xcresulttool export attachments --path "$bundle" --output-path .build/xcode-iphone/screenshots-$look
            scripts/keep-images.sh .build/xcode-iphone/screenshots-$look
          fi

      - name: Keep the screenshots when the test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-ui-test-screenshots-${{ matrix.part }}-${{ matrix.look }}
          # A failure on the sign-in screen can show the test account's
          # email, and artifacts on a public repo are public. Kept briefly.
          retention-days: 3
          path: .build/xcode-iphone/screenshots-*
          if-no-files-found: ignore

  # Gate 9's check, under the name the branch rules require. It passes only
  # when every part passed, in both looks, and runs after a failed part too, for the reason
  # given at Gate 7's.
  iphone-ui-test:
    name: iPhone UI test
    needs: iphone-ui-test-part
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && inputs.only != 'houses' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.iphone-ui-test-part.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::A part of the iPhone UI test did not pass. Its result: $RESULT."
            exit 1
          fi
          echo "Every part of the iPhone UI test passed."

  # Every UI test's "Scenario" line names a real scenario, on a platform that
  # scenario names, and the tables in Features/README.md match the tags (the
  # Definition of Done, item 3). The run's summary lists what still has no
  # test. The day a platform has nothing left, this adds --require for it,
  # and from then on a scenario without a test on that platform fails the
  # pull request. Connector is required. Server, the Mac, Linux and the
  # iPhone join it as each reaches zero.
  scenario-check:
    name: Scenario check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Tags and tables
        shell: bash
        run: python3 -I scripts/scenario-check.py --require Connector --list | tee -a "$GITHUB_STEP_SUMMARY"

      # Here because this job is small, needs nothing installed and the gate
      # waits on it. The Properties pointer is only honest if this passes.
      - name: The CI scripts' own tests
        run: make script-test

      # Xcode 26.6 crashes reading a Package.resolved that pins SwiftCrossUI's
      # packages with Properties linked. They belong to Linux only.
      - name: The app's Package.resolved pins nothing Linux-only
        run: make mac-pins

  wartable-connector:
    name: WarTable connector tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux execution sandbox
        run: sudo scripts/apt-install.sh bubblewrap
      - name: MCP, context, sandbox and provider behavior
        env:
          WARTABLE_REQUIRE_SANDBOX: "1"
        run: cd Extensions/WarTable/adapter && python3 -m unittest discover -s tests

  # The Houses UI tests, Mac and iPhone. They live in the private Properties
  # repo and join the UI test projects only when its checkout is linked
  # (WELLSPENT_PROPERTIES_PATH), so the nightly UI test jobs never see them.
  # No account is needed: the tests use the mock PriceLabs and a fresh data
  # folder. Runs on every pull request; a fork has no deploy key and passes
  # with a note, as the Linux job does.
  houses-ui-test:
    name: Houses UI test, ${{ matrix.platform }}
    needs: unit-tests
    # Nightly and by hand only, like every UI suite: a failure becomes a bug,
    # fixed the next morning. Not in the merge queue or on pull requests, and
    # Gate doesn't wait on it.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    # Each iPhone look has a Mac of its own: both looks in one job took 81
    # minutes one day and passed 120 the next, as the runners' speed swings.
    # One look is about 55 minutes on a slow day, plus the build.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [mac, iphone-light, iphone-dark]
    env:
      HAS_PROPERTIES_KEY: ${{ secrets.PROPERTIES_DEPLOY_KEY != '' }}
      HAS_MAILBOX: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN != '' }}
      # The classes that sign in to staging, the app's own and Properties',
      # and how many tests each list holds. A new one adds its class here and
      # its count below; a Properties one in the app pull request that moves
      # .github/properties-ref past it.
      MAC_SIGNED_IN: WellSpentUITests/PlanLimitTests WellSpentUITests/SharedHousesTests WellSpentUITests/MemberHousesTests WellSpentUITests/HouseLockTests
      MAC_SIGNED_IN_COUNT: 7
      IPHONE_SIGNED_IN: WellSpentPhoneUITests/PhoneLockedHouseTests WellSpentPhoneUITests/PhonePlanLimitTests WellSpentPhoneUITests/PhoneSharedHousesTests WellSpentPhoneUITests/PhoneMemberHousesTests WellSpentPhoneUITests/PhonePlansOffTests
      IPHONE_SIGNED_IN_COUNT: 8
    steps:
      - uses: actions/checkout@v4

      - name: No deploy key here, so nothing to test with
        if: env.HAS_PROPERTIES_KEY != 'true'
        run: echo "PROPERTIES_DEPLOY_KEY is not set; the Houses UI tests need the private checkout."

      - name: Select the newest Xcode on the image
        if: env.HAS_PROPERTIES_KEY == 'true'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # No GTK: the kit and Properties read their Linux pieces only on
      # Linux, so Xcode never asks for it (scripts/check-mac-pins.py).
      - name: Install xcodegen
        if: env.HAS_PROPERTIES_KEY == 'true'
        run: brew install xcodegen

      - name: Check out the Properties package at .github/properties-ref
        if: env.HAS_PROPERTIES_KEY == 'true'
        env:
          PROPERTIES_DEPLOY_KEY: ${{ secrets.PROPERTIES_DEPLOY_KEY }}
        run: scripts/checkout-properties.sh "$RUNNER_TEMP/wellspent-properties"

      # Nightly and by hand, a missing token fails the job, so a run never
      # passes with the signed-in tests quietly left out.
      - name: The run has the mailbox token
        if: env.HAS_PROPERTIES_KEY == 'true' && env.HAS_MAILBOX != 'true'
        run: |
          echo "::error::WELLSPENT_UI_TEST_MAILBOX_TOKEN is not set, so the Properties tests that sign in can't run."
          exit 1

      # Three fresh accounts on a paid plan for the classes that sign in. A test
      # that wants staging itself to refuse signs up an account of its own,
      # which starts free, through the same mailbox token.
      - name: Make this run's own staging accounts
        if: env.HAS_PROPERTIES_KEY == 'true' && env.HAS_MAILBOX == 'true'
        env:
          WELLSPENT_UI_TEST_MAILBOX_TOKEN: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN }}
        run: |
          python3 -I scripts/fresh-test-accounts.py "houses-${{ matrix.platform }}" "$RUNNER_TEMP/ui-test-accounts.env"

      - name: Run the Mac Houses UI tests
        if: env.HAS_PROPERTIES_KEY == 'true' && matrix.platform == 'mac'
        env:
          WELLSPENT_PROPERTIES_PATH: ${{ runner.temp }}/wellspent-properties
          WELLSPENT_UI_TEST_MAILBOX_TOKEN: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN }}
        run: |
          set -a; . "$RUNNER_TEMP/ui-test-accounts.env"; set +a
          make ui-test UI_TEST_ONLY="WellSpentUITests/HousesTests WellSpentUITests/PropertiesRailTests $MAC_SIGNED_IN"

      - name: Run the iPhone Houses UI tests in one look
        if: env.HAS_PROPERTIES_KEY == 'true' && matrix.platform != 'mac'
        env:
          WELLSPENT_PROPERTIES_PATH: ${{ runner.temp }}/wellspent-properties
          WELLSPENT_UI_TEST_MAILBOX_TOKEN: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN }}
        run: |
          set -a; . "$RUNNER_TEMP/ui-test-accounts.env"; set +a
          make iphone-ui-test IPHONE_UI_TEST_LOOKS="${{ matrix.platform == 'iphone-dark' && 'dark' || 'light' }}" IPHONE_UI_TEST_ONLY="WellSpentPhoneUITests/PhoneHousesTests WellSpentPhoneUITests/PhonePropertiesTabTests/testTurningOnPropertiesAddsTheTab $IPHONE_SIGNED_IN"

      # Each run must show it tested something: four Houses tests on the
      # Mac, and four in its iPhone look, plus the signed-in ones. Nothing
      # skipped, as for every UI job.
      - name: The Houses tests ran, and nothing was skipped
        if: env.HAS_PROPERTIES_KEY == 'true'
        run: |
          if [ "${{ matrix.platform }}" = mac ]; then
            bundles=".build/xcode/ui-test.xcresult"
          else
            bundles=".build/xcode-iphone/ui-test-${{ matrix.platform == 'iphone-dark' && 'dark' || 'light' }}.xcresult"
          fi
          if [ "${{ matrix.platform }}" = mac ]; then want=$((4 + MAC_SIGNED_IN_COUNT)); else want=$((4 + IPHONE_SIGNED_IN_COUNT)); fi
          scripts/passed-at-least.sh "$want" $bundles
          scripts/skipped-tests.sh $bundles

      - name: Pull the screenshots out of a failed Mac run
        if: failure() && matrix.platform == 'mac'
        run: |
          if [ -d .build/xcode/ui-test.xcresult ]; then
            xcrun xcresulttool export attachments --path .build/xcode/ui-test.xcresult --output-path .build/xcode/ui-test-screenshots
            scripts/keep-images.sh .build/xcode/ui-test-screenshots
          fi

      - name: Keep the screenshots when the Mac test fails
        if: failure() && matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: houses-ui-test-screenshots
          retention-days: 3
          path: .build/xcode/ui-test-screenshots

  gate:
    name: Gate
    needs: [unit-tests, coverage, docker-build, postgres-tests, linux-client-tests, linux-app-build, linux-client-with-properties, ios-build, scenario-check, wartable-connector]
    # Runs after a failure too, so a failed gate blocks the merge. Not after a
    # cancel: a newer push to the same pull request cancelled this run, and
    # its own run reports. Counting the cancel as a failure labelled and
    # commented on pull requests that had nothing wrong with them.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Make sure the label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "gates: failing" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "CI gates are failing; do not merge" --force || true

      - name: Block the merge when a gate fails
        if: needs.unit-tests.result != 'success' || needs.coverage.result != 'success' || needs.docker-build.result != 'success' || needs.postgres-tests.result != 'success' || needs.linux-client-tests.result != 'success' || needs.linux-app-build.result != 'success' || needs.linux-client-with-properties.result != 'success' || needs.ios-build.result != 'success' || needs.scenario-check.result != 'success' || needs.wartable-connector.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GATE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_GATE_TOKEN: ${{ secrets.GATE_TOKEN != '' }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            # In the merge queue there is no pull request to label; failing is enough.
            echo "::error::Gates failed."
            exit 1
          fi
          gh pr edit "$PR" --add-label "gates: failing" --repo "$GITHUB_REPOSITORY" || true

          if [ "$HAS_GATE_TOKEN" = "true" ] && gh pr ready "$PR" --undo --repo "$GITHUB_REPOSITORY"; then
            note="Gates failed, so this was converted to a draft and cannot be merged. Push a fix and it will be marked ready again automatically."
          else
            note="Gates failed. This pull request is labelled \`gates: failing\` and must not be merged. It could not be converted to a draft, because the default GITHUB_TOKEN is not allowed to do that; add a GATE_TOKEN secret to make this an actual block."
            echo "::warning::Could not convert to a draft. Add a GATE_TOKEN secret (fine-grained PAT, Pull requests: write) to make this gate block rather than advise."
          fi

          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$note" || true
          echo "::error::Gates failed."
          exit 1

      - name: Release the merge when every gate passes
        if: needs.unit-tests.result == 'success' && needs.coverage.result == 'success' && needs.docker-build.result == 'success' && needs.postgres-tests.result == 'success' && needs.linux-client-tests.result == 'success' && needs.linux-app-build.result == 'success' && needs.linux-client-with-properties.result == 'success' && needs.ios-build.result == 'success' && needs.scenario-check.result == 'success' && needs.wartable-connector.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GATE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_GATE_TOKEN: ${{ secrets.GATE_TOKEN != '' }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -n "$PR" ] || exit 0  # the merge queue has no pull request to update
          # Only undo what this workflow did. An intentional draft stays a draft.
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
               --jq '.labels[].name' | grep -qx "gates: failing"; then
            gh pr edit "$PR" --remove-label "gates: failing" --repo "$GITHUB_REPOSITORY" || true
            if [ "$HAS_GATE_TOKEN" = "true" ]; then
              gh pr ready "$PR" --repo "$GITHUB_REPOSITORY" || true
            fi
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Gates pass." || true
          fi
