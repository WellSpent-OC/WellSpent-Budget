# Throwaway proof run for #202, on hamilton/proof-202 only. Runs one class,
# PhonePlanTests, in light, with this job's own fresh staging accounts, and
# keeps the masked step notes and guarded pictures. Never merged.
name: Proof group 4

on:
  push:
    branches: [hamilton/proof-group4]

jobs:
  phone-plan-tests:
    name: Group 4 iPhone tests, light
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the image
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build the iPhone app and its UI tests
        run: make iphone-ui-test-build

      - name: Make this job's own two staging accounts
        env:
          WELLSPENT_UI_TEST_MAILBOX_TOKEN: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN }}
        run: python3 -I scripts/fresh-test-accounts.py "iphone-proof-group4" "$RUNNER_TEMP/ui-test-accounts.env"

      - name: Run group 4 tests in light
        env:
          WELLSPENT_UI_TEST_MAILBOX_TOKEN: ${{ secrets.WELLSPENT_UI_TEST_MAILBOX_TOKEN }}
        run: |
          set -a; . "$RUNNER_TEMP/ui-test-accounts.env"; set +a
          make iphone-ui-test IPHONE_UI_TEST_LOOKS=light IPHONE_UI_TEST_ONLY="WellSpentPhoneUITests/PhoneRepeatTests/testSettingARepeatShowsInTheListAndOnTheCountLine WellSpentPhoneUITests/PhoneRepeatTests/testMoneyInDoesNotRepeat WellSpentPhoneUITests/PhoneRepeatTests/testAChangeSaysWhichMonthsItReaches WellSpentPhoneUITests/PhoneRepeatTests/testStopRepeatingEndsTheRepeatAndKeepsTheBill WellSpentPhoneUITests/PhoneRepeatTests/testDeletingAMadeBillAsksBothChoices WellSpentPhoneUITests/PhoneMoneyInTests/testAnEntryCanBeMoneyComingIn WellSpentPhoneUITests/PhoneMoneyInTests/testAGroupsCashFlowCountsTheMortgageAsMoneyOut WellSpentPhoneUITests/PhoneSharingTests/testEmailInboxRejectAndAcceptAFreshInvitation"

      # The result bundle never leaves the runner: its activity log records
      # what is typed into the sign-in fields. Only pictures are kept.
      - name: Pull the pictures out of the run
        if: ${{ !cancelled() }}
        run: |
          bundle=.build/xcode-iphone/ui-test-light.xcresult
          if [ -d "$bundle" ]; then
            xcrun xcresulttool export attachments --path "$bundle" --output-path .build/xcode-iphone/proof-group4
            scripts/keep-images.sh .build/xcode-iphone/proof-group4
          fi

      - name: Keep the pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: proof-group4-pictures
          retention-days: 3
          path: .build/xcode-iphone/proof-group4
          if-no-files-found: ignore
