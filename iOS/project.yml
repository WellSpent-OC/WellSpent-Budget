# The Xcode project for the iPhone app.
#
# WellSpentPhone.xcodeproj is generated next to this file by `make iphone-project`
# (xcodegen generate --spec iOS/project.yml) and is ignored by git, like every
# .xcodeproj here. The Swift package at the repo root stays the source of truth.
# The app is the package's WellSpentAppCore, with the iPhone's own screens,
# around the one shell file in this folder. An iPhone app needs an Xcode
# project, a bundled .app and xcodebuild, none of which a package has.
#
# One app target, WellSpentPhone, in two builds: Debug is staging, run only in
# the simulator, as app.wellspent.mac.staging. Release is live, for TestFlight,
# as the Mac's own app.wellspent.mac, so both share one app record.
# WellSpentEnvironment is what the app reads to decide which build it is:
# anything but "live" is staging, with the orange banner, its own budgets, and
# the live server refused.
name: WellSpentPhone
options:
  minimumXcodeGenVersion: "2.40.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  WellSpentBudget:
    path: ..

targets:
  WellSpentPhone:
    type: application
    platform: iOS
    sources:
      - path: WellSpentPhoneApp.swift
      - path: Assets.xcassets
      # Apple's privacy file, which every iPhone upload carries.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WellSpentBudget
        product: WellSpentAppCore
    # Written by xcodegen into the ignored .build folder. The values that differ
    # between the two builds come from the settings below.
    info:
      path: ../.build/xcodegen/WellSpentPhone-Info.plist
      properties:
        CFBundleDisplayName: $(WELLSPENT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        WellSpentEnvironment: $(WELLSPENT_ENVIRONMENT)
        # The export question, answered: the app encrypts only through Apple's
        # CryptoKit, as the Mac app's Info.plist says too, so an upload never
        # waits on it.
        ITSAppUsesNonExemptEncryption: false
    # On the target, because xcodegen's own target defaults would otherwise
    # win over the project's.
    #
    # Two builds of one app. Debug is staging, for the simulator only, signed to
    # run locally with no team. Release is live, for TestFlight, signed for the
    # App Store. The live build's team and profile are not written here: make
    # iphone-testflight reads them from the profile file on the machine that
    # signs, so no account name or identifier sits in the repo.
    settings:
      base:
        PRODUCT_NAME: WellSpentPhone
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. iPad later is one more value here, plus its layout work.
        TARGETED_DEVICE_FAMILY: "1"
        # make iphone-testflight sets both from the release tag and the clock.
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.wellspent.mac.staging
          WELLSPENT_ENVIRONMENT: staging
          WELLSPENT_DISPLAY_NAME: WellSpent Staging
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
        Release:
          # The Mac's bundle ID: one app record and one subscription for both.
          PRODUCT_BUNDLE_IDENTIFIER: app.wellspent.mac
          WELLSPENT_ENVIRONMENT: live
          WELLSPENT_DISPLAY_NAME: WellSpent
          CODE_SIGN_IDENTITY: Apple Distribution

  # The iPhone's own UI tests (UITests/), and what they share with the Mac's
  # (../Tests/UITestShared). They drive WellSpentPhone in the simulator. The
  # package products are for the headless second person and the screens' words.
  WellSpentPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: ../Tests/UITestShared
    dependencies:
      - target: WellSpentPhone
      - package: WellSpentBudget
        product: WellSpentAppCore
      - package: WellSpentBudget
        product: WellSpentCrypto
      - package: WellSpentBudget
        product: WellSpentSync
      - package: WellSpentBudget
        product: WellSpentStore
      - package: WellSpentBudget
        product: WellSpentKeyStore
      - package: WellSpentBudget
        product: WellSpentModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wellspent.mac.phone-uitests
        TEST_TARGET_NAME: WellSpentPhone
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

schemes:
  WellSpentPhone:
    build:
      targets:
        WellSpentPhone: all
        WellSpentPhoneUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WellSpentPhoneUITests
