[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wellspent-wartable-adapter"
version = "0.1.0"
description = "Local MCP and CLI connector for WarTable"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
wartable = "wartable_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wartable_adapter*"]
